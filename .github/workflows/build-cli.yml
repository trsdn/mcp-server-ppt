name: Build CLI

permissions:
  contents: read

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/PptMcp.CLI/**'
      - 'src/PptMcp.Core/**'
      - 'src/PptMcp.ComInterop/**'
      - 'tests/PptMcp.CLI.Tests/**'
      - 'tests/PptMcp.Core.Tests/**'
      - 'tests/PptMcp.ComInterop.Tests/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/build-cli.yml'
  # No paths filter on pull_request: build-cli is a required status check on
  # main, and a required check that is skipped never reports, which leaves
  # documentation-, lock-file- and workflow-only pull requests permanently
  # unmergeable. Running it on every pull request keeps the gate meaningful.
  pull_request:
    branches: [ main ]

jobs:
  build-cli:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore dependencies
      run: dotnet restore src/PptMcp.CLI/PptMcp.CLI.csproj

    - name: Build CLI
      run: dotnet build src/PptMcp.CLI/PptMcp.CLI.csproj --no-restore --configuration Release

    - name: Verify documented tool and operation counts
      run: |
        Write-Output "Verifying documented counts against the generated tool surface..."
        & scripts/check-documented-counts.ps1
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Documented counts do not match the generated tool surface."
          exit 1
        }
      shell: pwsh

    - name: Verify session/file parity between CLI and MCP
      run: |
        # The count gate above counts the MCP surface, so a CLI missing an action is
        # invisible to it. Session/file management is hand-written on both entry
        # points and has drifted before (#131).
        Write-Output "Verifying session/file action parity..."
        & scripts/check-session-parity.ps1
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Session/file action sets differ between the CLI and the MCP server."
          exit 1
        }
      shell: pwsh

    - name: Verify CLI build
      run: |
        # Check pptcli main executable
        if (Test-Path "src/PptMcp.CLI/bin/Release/net9.0-windows/pptcli.exe") {
          Write-Output "✅ pptcli.exe built successfully"
          $version = (Get-Item "src/PptMcp.CLI/bin/Release/net9.0-windows/pptcli.exe").VersionInfo.FileVersion
          Write-Output "Version: $version"

          # Test CLI help command (safe - no PowerPoint COM required)
          $helpOutput = & "src/PptMcp.CLI/bin/Release/net9.0-windows/pptcli.exe" --help 2>&1
          $exitCode = $LASTEXITCODE

          if ($exitCode -eq 0) {
            Write-Output "✅ CLI help command working (exit code: 0)"
            Write-Output "📋 Help output preview:"
            $helpOutput | Select-Object -First 5 | ForEach-Object { Write-Output "  $_" }
          } else {
            Write-Error "❌ CLI help command failed with exit code: $exitCode"
            Write-Output "Full output:"
            $helpOutput | ForEach-Object { Write-Output "  $_" }
            exit 1
          }
        } else {
          Write-Error "❌ pptcli.exe not found"
          exit 1
        }

        Write-Output "🔧 CLI tool ready for direct automation"
      shell: pwsh

    - name: Test CLI (requires PowerPoint)
      run: |
        Write-Output "ℹ️ Note: CLI tests skipped in CI - they require Microsoft PowerPoint"
        Write-Output "   Run 'dotnet test tests/PptMcp.CLI.Tests/' locally with PowerPoint installed"
      shell: pwsh

    - name: Upload CLI build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PptMcp-CLI-${{ github.sha }}
        path: src/PptMcp.CLI/bin/Release/net9.0-windows/
