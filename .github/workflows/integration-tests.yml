name: PowerPoint Integration Tests

permissions:
  contents: read

on:
  # No paths filter on pull_request: integration-runner-disabled is a required
  # status check on main, and a required check that is skipped never reports,
  # which leaves documentation-only pull requests permanently unmergeable.
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'llm-tests/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/integration-tests.yml'
  workflow_dispatch:
    inputs:
      run_on_demand:
        description: 'Run the slower RunType=OnDemand COM/session tests too'
        required: false
        default: false
        type: boolean
      run_llm_gate:
        description: 'Run the canonical manual LLM regression gate too'
        required: false
        default: false
        type: boolean

jobs:
  integration-runner-disabled:
    if: ${{ vars.ENABLE_POWERPOINT_INTEGRATION_CI != 'true' }}
    runs-on: windows-latest
    steps:
      - name: Report that the integration suite did NOT run
        shell: pwsh
        run: |
          # This job passes so that a required status check always reports, which keeps
          # documentation-only PRs mergeable. A green check named
          # "integration-runner-disabled" is easy to misread as coverage, so say plainly
          # what did not happen - in the job log and in the PR's checks summary.
          Write-Output "The PowerPoint integration suite did NOT run, and no CI job can run it."
          Write-Output ""
          Write-Output "This job is a placeholder. It executes no tests. It is green because a"
          Write-Output "required status check that never reports blocks every pull request."
          Write-Output ""
          Write-Output "These tests drive real PowerPoint through COM, which needs a self-hosted"
          Write-Output "Windows runner with Office installed. That runner was considered and"
          Write-Output "DECLINED - see docs/AZURE_SELFHOSTED_RUNNER_SETUP.md. This is a settled"
          Write-Output "decision, not a pending task."
          Write-Output ""
          Write-Output "Integration coverage is produced on a maintainer's machine instead, and"
          Write-Output "enforced at push time rather than in CI:"
          Write-Output ""
          Write-Output "  .\scripts\Invoke-LocalIntegrationGate.ps1   # runs the suite, writes evidence"
          Write-Output "  .\scripts\install-hooks.ps1                 # pre-push hook enforcing it"
          Write-Output ""
          Write-Output "The evidence manifest is bound to a commit SHA, so a push of code under"
          Write-Output "src/ or tests/ is refused unless that exact commit was verified locally."

          $summary = @(
            '## PowerPoint integration suite: DID NOT RUN',
            '',
            'No test that drives PowerPoint has executed in this CI run, and none can. These',
            'tests need a self-hosted Windows runner with Office installed, which was',
            'considered and **declined** - see `docs/AZURE_SELFHOSTED_RUNNER_SETUP.md`.',
            '',
            'This job executes no tests. It reports success only so that a required',
            'status check always reports. Do not read it as coverage.',
            '',
            '### Where integration coverage actually comes from',
            '',
            'It runs on a maintainer machine and is enforced **at push time**, not in CI:',
            '',
            '```powershell',
            '.\scripts\Invoke-LocalIntegrationGate.ps1   # runs the suite, writes an evidence manifest',
            '.\scripts\install-hooks.ps1                 # installs the pre-push hook that requires it',
            '```',
            '',
            'The manifest is bound to a commit SHA, so evidence for any other commit is',
            'rejected and a push touching `src/` or `tests/` is refused without it.',
            '',
            'The COM-free subset does run, in the **Hosted Checks** workflow.'
          ) -join "`n"
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  powerpoint-integration:
    # Retained deliberately. The self-hosted runner this job needs was declined, so the
    # job is unreachable - but it is the executable specification of what the local gate
    # in scripts/Invoke-LocalIntegrationGate.ps1 must cover. If a runner ever appears,
    # setting ENABLE_POWERPOINT_INTEGRATION_CI=true is the only step required.
    if: ${{ vars.ENABLE_POWERPOINT_INTEGRATION_CI == 'true' }}
    runs-on: [self-hosted, windows, powerpoint]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Build CLI and MCP Server
        shell: pwsh
        run: |
          dotnet build src/PptMcp.CLI/PptMcp.CLI.csproj -c Release
          dotnet build src/PptMcp.McpServer/PptMcp.McpServer.csproj -c Release

      - name: Run CLI smoke workflow
        shell: pwsh
        run: ./scripts/Test-CliWorkflow.ps1

      - name: Run MCP smoke workflow
        shell: pwsh
        run: >
          ./scripts/Invoke-GuardedTest.ps1
          -Project tests/PptMcp.McpServer.Tests/PptMcp.McpServer.Tests.csproj
          -Filter "FullyQualifiedName~McpServerIntegrationTests.SmokeTest_"
          -LoggerFileName mcp-smoke.trx

      - name: Run Core suite
        shell: pwsh
        run: >
          ./scripts/Invoke-GuardedTest.ps1
          -Project tests/PptMcp.Core.Tests/PptMcp.Core.Tests.csproj
          -Filter "RunType!=OnDemand"
          -LoggerFileName core-integration.trx

      - name: Run CLI integration suite
        shell: pwsh
        run: >
          ./scripts/Invoke-GuardedTest.ps1
          -Project tests/PptMcp.CLI.Tests/PptMcp.CLI.Tests.csproj
          -Full
          -LoggerFileName cli-integration.trx

      - name: Run MCP integration suite
        shell: pwsh
        run: >
          ./scripts/Invoke-GuardedTest.ps1
          -Project tests/PptMcp.McpServer.Tests/PptMcp.McpServer.Tests.csproj
          -Full
          -LoggerFileName mcp-integration.trx

      - name: Run OnDemand COM/session suite
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_on_demand }}
        shell: pwsh
        run: >
          dotnet test tests/PptMcp.ComInterop.Tests/PptMcp.ComInterop.Tests.csproj
          --filter "RunType=OnDemand"
          --logger "trx;LogFileName=cominterop-ondemand.trx"

      - name: Run canonical LLM regression gate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_llm_gate }}
        shell: pwsh
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
        run: ./scripts/Test-LlmRegressionGate.ps1

      - name: Upload integration test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powerpoint-integration-${{ github.run_id }}
          path: |
            **/*.trx
            llm-tests/TestResults/**
