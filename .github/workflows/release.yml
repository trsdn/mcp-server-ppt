name: Release All Components

# Unified release workflow for all PptMcp components:
# - MCP Server (NuGet + ZIP) - includes CLI as bundled dependency
# - CLI (NuGet) - standalone dotnet tool for coding agents
# - VS Code Extension (VSIX + Marketplace)
# - MCPB (Claude Desktop bundle)
# - Agent Skills (ZIP package)
#
# All components are released with the same version.
# Trigger: workflow_dispatch with version bump (major/minor/patch) or custom version.
# The workflow auto-calculates the next version from the latest git tag,
# creates the git tag after successful builds, then creates the GitHub release.
#
# Required GitHub Secrets:
# - NUGET_USER: Your NuGet.org username (profile name, NOT email)
# - VSCE_TOKEN: VS Code Marketplace PAT (only used when publish_vscode is true)
#
# npm publishing uses Trusted Publishing (OIDC) and needs no secret: ppt-mcp-skill and
# ppt-cli-skill both exist on npm and have a trusted publisher bound to this workflow
# file. OIDC requires npm 11.5.1 or newer, and the pinned Node runtime still bundles
# npm 10, so the publish job upgrades npm to ^11.5.1 and refuses to continue on an
# older one. The upper bound is deliberate: npm 12 blocks dependency install scripts
# by default. See docs/RELEASE-STRATEGY.md, "npm publishing".
#
# There is no token path any more. It existed only to bootstrap a package that did not
# exist yet - a trusted publisher is configured per package and cannot be set up in
# advance - and both packages were bootstrapped in the v1.1.0 release. If a *new* skill
# package is ever added, publish its first version manually from a workstation and bind
# a trusted publisher to it before wiring it in here.
# See docs/RELEASE-STRATEGY.md, "npm publishing".

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        type: choice
        default: 'patch'
        options:
          - major
          - minor
          - patch
      custom_version:
        description: 'Custom version (e.g., 1.2.3, overrides version_bump)'
        required: false
        type: string
      publish_vscode:
        description: 'Publish the extension to the VS Code Marketplace (requires the trsdn publisher to exist)'
        required: false
        type: boolean
        default: false
      publish_npm:
        description: 'Publish the skill packages to npm (turn off to release everything else if npm is unavailable)'
        required: false
        type: boolean
        default: true

env:
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '22'

jobs:
  # =============================================================================
  # Job 0: Calculate Version and Create Tag
  # =============================================================================
  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calculate_version.outputs.version }}
      tag: ${{ steps.calculate_version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history and tags

      - name: Calculate version
        id: calculate_version
        run: |
          # If custom version is provided, use it
          if [ -n "${{ inputs.custom_version }}" ]; then
            VERSION="${{ inputs.custom_version }}"
            echo "Using custom version: ${VERSION}"
          else
            # Get the latest tag.
            # Note: `git describe` only finds tags that are ancestors of HEAD.
            # This repository has release tags that sit outside the current
            # main history, so describe fails and would silently fall back to
            # v0.0.0 - producing a version *below* what is already published.
            # Sort all semver tags instead, which is independent of ancestry.
            LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)

            if [ -z "${LATEST_TAG}" ]; then
              echo "No existing semver tag found, starting from v0.0.0"
              LATEST_TAG="v0.0.0"
            fi
            echo "Latest tag: ${LATEST_TAG}"

            # Remove 'v' prefix if present
            CURRENT_VERSION="${LATEST_TAG#v}"
            echo "Current version: ${CURRENT_VERSION}"

            # Parse version components
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

            # Fail loudly rather than emit a bogus version from arithmetic on
            # non-numeric input.
            for component in "${MAJOR}" "${MINOR}" "${PATCH}"; do
              case "${component}" in
                ''|*[!0-9]*)
                  echo "::error::Could not parse '${LATEST_TAG}' as a semver tag"
                  exit 1
                  ;;
              esac
            done

            # Increment based on bump type
            case "${{ inputs.version_bump }}" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              patch)
                PATCH=$((PATCH + 1))
                ;;
            esac

            VERSION="${MAJOR}.${MINOR}.${PATCH}"
            echo "New version: ${VERSION}"
          fi

          TAG="v${VERSION}"

          # Check if tag already exists
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # =============================================================================
  # Job 1: Build CLI (dependency for MCP Server)
  # =============================================================================
  build-cli:
    name: CLI (Dependency)
    needs: [version]
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Set Version
      run: |
        $version = "${{ needs.version.outputs.version }}"
        echo "VERSION=$version" >> $env:GITHUB_ENV
      shell: pwsh

    - name: Restore
      run: dotnet restore src/PptMcp.CLI/PptMcp.CLI.csproj

    - name: Build CLI
      run: dotnet build src/PptMcp.CLI/PptMcp.CLI.csproj --configuration Release --no-restore -p:Version=${{ env.VERSION }} -p:AssemblyVersion=${{ env.VERSION }}.0 -p:FileVersion=${{ env.VERSION }}.0

    - name: Pack CLI NuGet
      run: dotnet pack src/PptMcp.CLI/PptMcp.CLI.csproj --configuration Release --no-build --output ./cli-nupkg -p:Version=${{ env.VERSION }}

    - name: Upload CLI Build Output
      uses: actions/upload-artifact@v4
      with:
        name: cli-build
        path: src/PptMcp.CLI/bin/Release/net9.0-windows/

    - name: Upload CLI NuGet Artifact
      uses: actions/upload-artifact@v4
      with:
        name: cli-nupkg
        path: cli-nupkg/*.nupkg

  # =============================================================================
  # Job 2: Build MCP Server (includes CLI bundle for service)
  # =============================================================================
  build-mcp-server:
    name: MCP Server
    needs: [version, build-cli]
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Download CLI Build
      uses: actions/download-artifact@v4
      with:
        name: cli-build
        path: src/PptMcp.CLI/bin/Release/net9.0-windows/

    - name: Set Version
      run: |
        $version = "${{ needs.version.outputs.version }}"
        echo "VERSION=$version" >> $env:GITHUB_ENV
        Write-Output "Version: $version"
      shell: pwsh

    - name: Update Project Versions
      run: |
        $version = $env:VERSION

        # Update MCP Registry server.json
        $serverJsonPath = "src/PptMcp.McpServer/.mcp/server.json"
        $serverContent = Get-Content $serverJsonPath -Raw
        $serverContent = $serverContent -replace '("version":\s*)"[\d\.]+"(\s*,\s*\n\s*"packages")' , "`$1`"$version`"`$2"
        $serverContent = $serverContent -replace '("identifier":\s*"Trsdn\.PptMcp\.McpServer",\s*\n\s*"version":\s*)"[\d\.]+"', "`$1`"$version`""
        Set-Content $serverJsonPath $serverContent
      shell: pwsh

    - name: Restore
      run: dotnet restore src/PptMcp.McpServer/PptMcp.McpServer.csproj

    - name: Build
      run: dotnet build src/PptMcp.McpServer/PptMcp.McpServer.csproj --configuration Release --no-restore -p:Version=${{ env.VERSION }} -p:AssemblyVersion=${{ env.VERSION }}.0 -p:FileVersion=${{ env.VERSION }}.0

    - name: Pack NuGet
      run: dotnet pack src/PptMcp.McpServer/PptMcp.McpServer.csproj --configuration Release --no-build --output ./nupkg -p:Version=${{ env.VERSION }}

    - name: Create Release Package
      run: |
        $version = $env:VERSION
        New-Item -ItemType Directory -Path "release/PptMcp-MCP-Server-$version" -Force
        Copy-Item "src/PptMcp.McpServer/bin/Release/net9.0-windows/*" "release/PptMcp-MCP-Server-$version/" -Recurse
        Copy-Item "README.md" "release/PptMcp-MCP-Server-$version/"
        Copy-Item "LICENSE" "release/PptMcp-MCP-Server-$version/"
        Compress-Archive -Path "release/PptMcp-MCP-Server-$version/*" -DestinationPath "PptMcp-MCP-Server-$version-windows.zip"
      shell: pwsh

    # Self-contained build for the npm wrapper (packages/mcp-server-ppt).
    # The -windows.zip above is framework-dependent and needs the .NET runtime
    # installed; the whole point of the npm route is that it does not.
    # The archive name is asserted by that package's `npm test`, so renaming it
    # here fails a check rather than 404-ing on a user's machine.
    - name: Create Self-Contained Release Package
      run: |
        $version = $env:VERSION
        dotnet publish src/PptMcp.McpServer/PptMcp.McpServer.csproj `
          --configuration Release `
          --runtime win-x64 `
          --self-contained true `
          -p:Version=$version -p:AssemblyVersion="$version.0" -p:FileVersion="$version.0" `
          --output "release/selfcontained-$version"
        Copy-Item "README.md" "release/selfcontained-$version/"
        Copy-Item "LICENSE" "release/selfcontained-$version/"
        Compress-Archive -Path "release/selfcontained-$version/*" -DestinationPath "PptMcp-MCP-Server-$version-win-x64.zip"
      shell: pwsh

    - name: Upload Self-Contained ZIP Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mcp-server-selfcontained-zip
        path: PptMcp-MCP-Server-*-win-x64.zip

    - name: Upload ZIP Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mcp-server-zip
        path: PptMcp-MCP-Server-*-windows.zip

    - name: Upload NuGet Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mcp-server-nupkg
        path: nupkg/*.nupkg

  # =============================================================================
  # Job 3: Build and Publish VS Code Extension
  # =============================================================================
  build-vscode:
    name: VS Code Extension
    needs: [version]
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Set Version
      run: |
        $version = "${{ needs.version.outputs.version }}"
        echo "VERSION=$version" >> $env:GITHUB_ENV
      shell: pwsh

    - name: Update Project Versions
      run: |
        $version = $env:VERSION

        # Update Directory.Build.props (single source of truth for all project versions)
        $propsPath = "Directory.Build.props"
        $content = Get-Content $propsPath -Raw
        $content = $content -replace '<Version>[\d\.]+</Version>', "<Version>$version</Version>"
        $content = $content -replace '<AssemblyVersion>[\d\.]+\.[\d\.]+</AssemblyVersion>', "<AssemblyVersion>$version.0</AssemblyVersion>"
        $content = $content -replace '<FileVersion>[\d\.]+\.[\d\.]+</FileVersion>', "<FileVersion>$version.0</FileVersion>"
        Set-Content $propsPath $content
      shell: pwsh

    - name: Update Extension Version
      run: |
        $version = $env:VERSION
        cd vscode-extension
        npm version "$version" --no-git-tag-version
      shell: pwsh

    - name: Sync Extension Changelog
      run: |
        Copy-Item "CHANGELOG.md" "vscode-extension/CHANGELOG.md" -Force
      shell: pwsh

    - name: Install Dependencies
      run: |
        cd vscode-extension
        npm install

    - name: Build and Package
      run: |
        cd vscode-extension
        npm run package

    - name: Rename VSIX
      run: |
        $version = $env:VERSION
        cd vscode-extension
        $vsix = Get-ChildItem -Filter "*.vsix" | Select-Object -First 1
        $targetName = "PptMcp-$version.vsix"
        if ($vsix.Name -ne $targetName) {
          Rename-Item $vsix.FullName -NewName $targetName
        }
      shell: pwsh

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: vscode-vsix
        path: vscode-extension/PptMcp-*.vsix

  # =============================================================================
  # Job 4: Build MCPB (Claude Desktop Bundle)
  # =============================================================================
  build-mcpb:
    name: MCPB Bundle
    needs: [version]
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Set Version
      run: |
        $version = "${{ needs.version.outputs.version }}"
        echo "VERSION=$version" >> $env:GITHUB_ENV
      shell: pwsh

    - name: Build MCPB Bundle
      run: |
        cd mcpb
        .\Build-McpBundle.ps1 -Version $env:VERSION
      shell: pwsh

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mcpb-bundle
        path: mcpb/artifacts/ppt-mcp-*.mcpb

  # =============================================================================
  # Job 5: Build Agent Skills Packages
  # =============================================================================
  build-agent-skills:
    name: Agent Skills
    needs: [version]
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Set Version
      run: |
        $version = "${{ needs.version.outputs.version }}"
        echo "VERSION=$version" >> $env:GITHUB_ENV
      shell: pwsh

    - name: Build Solution (generates SKILL.md and copies references)
      run: dotnet build -c Release
      shell: pwsh

    - name: Create Skills Package
      run: |
        $version = $env:VERSION
        $outputDir = "artifacts/skills"
        $skillsDir = "skills"

        # Create output directory
        New-Item -ItemType Directory -Path $outputDir -Force | Out-Null

        # Create staging directory
        $stagingDir = Join-Path $env:TEMP "ppt-skills-$([guid]::NewGuid().ToString('N').Substring(0,8))"
        New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null

        try {
          # Create skills/ subdirectory (the standard location for npx skills add)
          $skillsStagingDir = Join-Path $stagingDir "skills"
          New-Item -ItemType Directory -Path $skillsStagingDir -Force | Out-Null

          # Copy ppt-mcp skill (SKILL.md and references already generated by build)
          Copy-Item -Path "$skillsDir/ppt-mcp" -Destination "$skillsStagingDir/ppt-mcp" -Recurse

          # Copy ppt-cli skill (SKILL.md and references already generated by build)
          Copy-Item -Path "$skillsDir/ppt-cli" -Destination "$skillsStagingDir/ppt-cli" -Recurse

          # Copy skills README to root of package
          if (Test-Path "$skillsDir/README.md") {
            Copy-Item -Path "$skillsDir/README.md" -Destination $stagingDir
          }

          # Create ZIP archive
          $zipPath = Join-Path $outputDir "ppt-skills-v$version.zip"
          Compress-Archive -Path "$stagingDir\*" -DestinationPath $zipPath -CompressionLevel Optimal
          Write-Host "Created: $zipPath"

        } finally {
          Remove-Item $stagingDir -Recurse -Force -ErrorAction SilentlyContinue
        }

        # Copy platform-specific files
        if (Test-Path "$skillsDir/CLAUDE.md") {
          Copy-Item -Path "$skillsDir/CLAUDE.md" -Destination $outputDir
        }
        if (Test-Path "$skillsDir/.cursorrules") {
          Copy-Item -Path "$skillsDir/.cursorrules" -Destination $outputDir
        }

        # Generate manifest.json
        $manifest = @{
          name = "ppt-skills"
          version = $version
          description = "PowerPoint MCP Server Agent Skills for AI coding assistants"
          platforms = @("github-copilot", "claude-code", "cursor", "windsurf", "gemini-cli", "goose", "codex", "opencode", "amp", "kilo", "roo", "trae")
          skills = @(
            @{
              name = "ppt-mcp"
              path = "skills/ppt-mcp"
              description = "MCP Server skill - for conversational AI (Claude Desktop, VS Code Chat)"
              target = "MCP Server"
            }
            @{
              name = "ppt-cli"
              path = "skills/ppt-cli"
              description = "CLI skill - for coding agents (Copilot, Cursor, Windsurf)"
              target = "CLI Tool"
            }
          )
          installation = @{
            npx = "npx skills add trsdn/mcp-server-ppt"
            selectSkill = "npx skills add trsdn/mcp-server-ppt --skill ppt-cli"
            installBoth = "npx skills add trsdn/mcp-server-ppt --skill '*'"
          }
          files = @(
            @{ name = "CLAUDE.md"; type = "config"; description = "Claude Code project instructions" }
            @{ name = ".cursorrules"; type = "config"; description = "Cursor project rules" }
          )
          repository = "https://github.com/trsdn/mcp-server-ppt"
          documentation = "https://github.com/trsdn/mcp-server-ppt"
          buildDate = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
        }
        $manifest | ConvertTo-Json -Depth 10 | Set-Content -Path "$outputDir/manifest.json" -Encoding UTF8
        Write-Host "Created: manifest.json"
      shell: pwsh

    - name: Upload Skills Artifact
      uses: actions/upload-artifact@v4
      with:
        name: agent-skills
        path: artifacts/skills/ppt-skills-*.zip

    - name: Populate npm Skill Packages
      run: |
        $version = $env:VERSION

        # These packages are what npm publishes. A skill shipped without its
        # references still installs and still looks fine, so a missing copy here
        # would never be noticed - fail loudly instead.
        $packages = @(
          @{ Name = "ppt-mcp"; Source = "skills/ppt-mcp"; Target = "packages/ppt-mcp-skill/skills/ppt-mcp" }
          @{ Name = "ppt-cli"; Source = "skills/ppt-cli"; Target = "packages/ppt-cli-skill/skills/ppt-cli" }
        )

        foreach ($pkg in $packages) {
          $source = $pkg.Source
          $target = $pkg.Target

          foreach ($required in @("$source/SKILL.md", "$source/references")) {
            if (-not (Test-Path $required)) {
              Write-Error "$required is missing - the build did not generate it, so $($pkg.Name) would ship incomplete."
              exit 1
            }
          }

          $referenceCount = @(Get-ChildItem "$source/references" -File -Recurse).Count
          if ($referenceCount -eq 0) {
            Write-Error "$source/references is empty - $($pkg.Name) would ship without reference documentation."
            exit 1
          }

          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Get-ChildItem $target -Exclude ".gitkeep" -Recurse -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force

          Copy-Item "$source/SKILL.md" $target
          Copy-Item "$source/references" "$target/references" -Recurse

          $copied = @(Get-ChildItem "$target/references" -File -Recurse).Count
          if ($copied -ne $referenceCount) {
            Write-Error "Copied $copied of $referenceCount reference files for $($pkg.Name)."
            exit 1
          }

          Write-Host "$($pkg.Name): SKILL.md + $copied reference file(s)"
        }

        # Update versions in package.json files
        #
        # mcp-server-ppt is stamped but NOT published by this workflow. It does not
        # exist on npm yet, and a trusted publisher can only be bound to a package
        # that already has a version, so the first publish has to be manual (see
        # docs/RELEASE-STRATEGY.md, "npm publishing"). Stamping it here means that
        # manual publish, done from a release-tagged checkout, carries the right
        # version - which matters more for this package than for the skills,
        # because the wrapper derives its download URL from its own version.
        foreach ($pkg in @("packages/ppt-mcp-skill/package.json", "packages/ppt-cli-skill/package.json", "packages/mcp-server-ppt/package.json")) {
          $content = Get-Content $pkg -Raw
          $content = $content -replace '"version":\s*"[\d\.]+"', "`"version`": `"$version`""
          Set-Content $pkg $content
        }

        Write-Host "Populated npm skill packages at v$version"
      shell: pwsh

    - name: Upload npm Skill Packages
      uses: actions/upload-artifact@v4
      with:
        name: npm-skill-packages
        path: packages/

  # =============================================================================
  # Job 6: Wait for NuGet Propagation + MCP Registry
  # =============================================================================
  publish-mcp-registry:
    name: MCP Registry
    needs: [version, create-tag, build-mcp-server]
    runs-on: windows-latest
    permissions:
      id-token: write

    steps:
    - uses: actions/checkout@v4

    - name: Set Version
      run: |
        $version = "${{ needs.version.outputs.version }}"
        echo "VERSION=$version" >> $env:GITHUB_ENV
      shell: pwsh

    - name: Update server.json Version
      run: |
        $version = $env:VERSION
        $serverJsonPath = "src/PptMcp.McpServer/.mcp/server.json"
        $serverContent = Get-Content $serverJsonPath -Raw
        $serverContent = $serverContent -replace '("version":\s*)"[\d\.]+"(\s*,\s*\n\s*"packages")' , "`$1`"$version`"`$2"
        $serverContent = $serverContent -replace '("identifier":\s*"Trsdn\.PptMcp\.McpServer",\s*\n\s*"version":\s*)"[\d\.]+"', "`$1`"$version`""
        Set-Content $serverJsonPath $serverContent
      shell: pwsh

    - name: Wait for NuGet Propagation
      run: |
        $version = $env:VERSION
        # The v3 flat container requires an all-lowercase package id. This was
        # "PptMcp.mcpserver", so every request 404'd and the loop always ran its full
        # three attempts (20 minutes) before falling through.
        $packageId = "pptmcp.mcpserver"
        $readmeUrl = "https://api.nuget.org/v3-flatcontainer/$packageId/$version/readme"

        Write-Output "Waiting for NuGet CDN propagation..."
        $maxAttempts = 3
        $pollInterval = 600  # 10 minutes

        for ($i = 1; $i -le $maxAttempts; $i++) {
          Write-Output "Attempt $i of $maxAttempts..."
          try {
            $response = Invoke-WebRequest -Uri $readmeUrl -UseBasicParsing -ErrorAction Stop
            if ($response.StatusCode -eq 200) {
              $content = [System.Text.Encoding]::UTF8.GetString($response.Content)
              if ($content -match "mcp-name:\s+io\.github\.trsdn/mcp-server-ppt") {
                Write-Output "README propagated successfully"
                break
              }
            }
          } catch {
            Write-Output "README not yet available"
          }
          if ($i -lt $maxAttempts) {
            Start-Sleep -Seconds $pollInterval
          }
        }
      shell: pwsh

    - name: Install MCP Publisher
      run: |
        $arch = if ([System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture -eq "Arm64") { "arm64" } else { "amd64" }
        Invoke-WebRequest -Uri "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_windows_$arch.tar.gz" -OutFile "mcp-publisher.tar.gz"
        tar xf mcp-publisher.tar.gz mcp-publisher.exe
      shell: pwsh

    # No continue-on-error: this publish does work (io.github.trsdn/mcp-server-ppt is
    # live for 1.0.1-1.0.3), but a publish that cannot fail cannot be trusted to keep
    # working, so a failure must surface instead of being swallowed.
    - name: Publish to MCP Registry
      run: |
        ./mcp-publisher.exe login github-oidc
        Set-Location src/PptMcp.McpServer/.mcp
        ../../../mcp-publisher.exe publish --verbose
      shell: pwsh

  # =============================================================================
  # Job 7: Create Git Tag
  # =============================================================================
  create-tag:
    name: Create Git Tag
    needs: [version, build-mcp-server, build-vscode, build-mcpb, build-agent-skills]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          echo "Creating tag: $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  # =============================================================================
  # Job 8: Publish to External Registries (after all builds succeed)
  # =============================================================================
  publish:
    name: Publish to Registries
    needs: [version, create-tag]
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write  # Required for NuGet OIDC

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Set Version
      run: |
        $version = "${{ needs.version.outputs.version }}"
        echo "VERSION=$version" >> $env:GITHUB_ENV
      shell: pwsh

    - name: Download NuGet Package
      uses: actions/download-artifact@v4
      with:
        name: mcp-server-nupkg
        path: nupkg

    - name: Download CLI NuGet Package
      uses: actions/download-artifact@v4
      with:
        name: cli-nupkg
        path: cli-nupkg

    - name: Download VS Code VSIX
      uses: actions/download-artifact@v4
      with:
        name: vscode-vsix
        path: vscode-vsix

    - name: Download npm Skill Packages
      uses: actions/download-artifact@v4
      with:
        name: npm-skill-packages
        path: npm-packages

    # Runs before the NuGet push because that step is irreversible: a version pushed to
    # NuGet.org cannot be replaced. Everything npm needs is therefore proven here.
    #
    # Trusted Publishing (OIDC) can only publish a package that already exists, because
    # the trusted publisher is configured per package in the npm UI - which is why every
    # release up to v1.0.3 failed here, when both skill packages were still new. Both
    # exist since v1.1.0, so a missing package now means a real configuration problem and
    # must stop the release before the irreversible NuGet push.
    #
    # Asked over the registry API rather than `npm view`, because npm resolves through
    # whatever registry the environment configured and a proxy feed's 404 does not mean
    # the package is absent from npmjs.org.
    - name: Preflight npm publishing
      if: ${{ inputs.publish_npm }}
      shell: pwsh
      run: |
        $missing = @()
        foreach ($package in @('ppt-mcp-skill', 'ppt-cli-skill')) {
            $response = Invoke-WebRequest -Uri "https://registry.npmjs.org/$package" `
                -Method Get -UseBasicParsing -TimeoutSec 30 -SkipHttpErrorCheck
            if ($response.StatusCode -eq 200) {
                Write-Output "Exists on npm: $package"
            } elseif ($response.StatusCode -eq 404) {
                $missing += $package
            } else {
                Write-Output "::error::Could not query npm for $package (HTTP $($response.StatusCode))."
                Write-Output "Refusing to continue, because the next steps push to NuGet.org and cannot be undone."
                exit 1
            }
        }

        if ($missing.Count -gt 0) {
            Write-Output "::error::These packages do not exist on npm: $($missing -join ', ')."
            Write-Output "Trusted Publishing (OIDC) cannot create a package - it only authorises"
            Write-Output "publishes for a package that already exists and has a trusted publisher."
            Write-Output "Publish the first version manually and bind a trusted publisher to it,"
            Write-Output "or dispatch the release with publish_npm: false to release everything else."
            Write-Output "See docs/RELEASE-STRATEGY.md, 'npm publishing'."
            exit 1
        }

        # npm only learned trusted publishing in 11.5.1 and the Node 22 runtime
        # pinned above still bundles npm 10, which has no OIDC support at all - it would
        # quietly fall back to looking for a token that no longer exists.
        #
        # Pinned to ^11.5.1 rather than @latest on purpose: npm 12 blocks dependency
        # install scripts by default, which has already broken release runs in sibling
        # repositories (a native binding that never got built, and a rejected esbuild
        # binary). ^11.5.1 stays above the OIDC minimum and below that breaking major.
        # Raise the bound deliberately, having checked npm 12's allow-scripts policy -
        # do not "tidy" it back to @latest.
        npm install -g "npm@^11.5.1" 2>&1 | Out-Null
        $raw = (npm --version | Select-Object -Last 1).Trim()
        if ($raw -notmatch '^(\d+\.\d+\.\d+)') {
            Write-Output "::error::Could not determine the npm version (got '$raw')."
            exit 1
        }
        $npmVersion = [version]$Matches[1]
        if ($npmVersion -lt [version]'11.5.1') {
            Write-Output "::error::npm $npmVersion cannot use Trusted Publishing; 11.5.1 or newer is required."
            Write-Output "Upgrading npm failed, so raise NODE_VERSION or install npm@^11.5.1 explicitly."
            exit 1
        }
        Write-Output "npm authentication: OIDC trusted publishing (npm $npmVersion)."

    # A publisher that was just created has no extensions yet, which is exactly the
    # state this preflight exists for. Asking the extension query about the publisher
    # therefore cannot answer the question: it returns an empty list both for a missing
    # publisher and for a new, empty one. The public publisher page separates the two.
    - name: Preflight VS Code Marketplace
      if: ${{ inputs.publish_vscode }}
      shell: pwsh
      run: |
        $response = Invoke-WebRequest -Uri 'https://marketplace.visualstudio.com/publishers/trsdn' `
            -Method Get -UseBasicParsing -TimeoutSec 30 -SkipHttpErrorCheck
        if ($response.StatusCode -eq 404) {
            Write-Output "::error::The 'trsdn' Marketplace publisher does not exist."
            Write-Output "Create it at https://marketplace.visualstudio.com/manage with the id 'trsdn',"
            Write-Output "or dispatch the release with publish_vscode: false."
            exit 1
        }
        if ($response.StatusCode -ne 200) {
            Write-Output "::error::Could not verify the 'trsdn' Marketplace publisher (HTTP $($response.StatusCode))."
            Write-Output "Refusing to continue, because the next step pushes to NuGet.org and cannot be undone."
            exit 1
        }
        Write-Output "Marketplace publisher 'trsdn' exists."

    - name: NuGet Login (OIDC)
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Publish to NuGet.org
      run: |
        $version = $env:VERSION
        dotnet nuget push "nupkg/PptMcp.McpServer.$version.nupkg" `
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} `
          --source https://api.nuget.org/v3/index.json `
          --skip-duplicate
        Write-Output "Published PptMcp.McpServer.$version to NuGet.org"

        dotnet nuget push "cli-nupkg/PptMcp.CLI.$version.nupkg" `
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} `
          --source https://api.nuget.org/v3/index.json `
          --skip-duplicate
        Write-Output "Published PptMcp.CLI.$version to NuGet.org"
      shell: pwsh

    # The v1.0.3 release reported this step as successful while the extension never
    # reached the Marketplace: continue-on-error masked the failure, and the job
    # summary claimed a publish that had not happened. The step is now opt-in and
    # its result is verified against the Marketplace API.
    - name: Publish to VS Code Marketplace
      if: ${{ inputs.publish_vscode }}
      uses: HaaLeo/publish-vscode-extension@v2
      with:
        pat: ${{ secrets.VSCE_TOKEN }}
        registryUrl: https://marketplace.visualstudio.com
        extensionFile: vscode-vsix/PptMcp-${{ env.VERSION }}.vsix

    # A freshly uploaded extension goes through Marketplace validation before it appears
    # in the gallery, so a single immediate query would fail every first-time publish.
    # The listing is checked for *this* version: an existing listing still carrying the
    # previous version would otherwise be reported as a successful publish. The compare
    # is an exact string equality against each returned version, never a substring or
    # -match, because "1.1.0" is a substring of "11.1.0".
    - name: Verify Marketplace listing
      if: ${{ inputs.publish_vscode }}
      shell: pwsh
      run: |
        $body = '{"filters":[{"criteria":[{"filterType":7,"value":"trsdn.ppt-mcp"}],"pageNumber":1,"pageSize":1}],"flags":914}'
        $headers = @{ Accept = 'application/json;api-version=7.2-preview.1'; 'Content-Type' = 'application/json' }
        $deadline = (Get-Date).AddMinutes(10)
        while ((Get-Date) -lt $deadline) {
            $response = Invoke-RestMethod -Uri 'https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery' -Method Post -Headers $headers -Body $body
            $extension = $response.results[0].extensions
            if ($extension) {
                $versions = @($extension[0].versions | ForEach-Object { $_.version })
                if ($versions -contains $env:VERSION) {
                    Write-Output "Marketplace listing confirmed: trsdn.ppt-mcp $env:VERSION"
                    exit 0
                }
                Write-Output "Marketplace lists trsdn.ppt-mcp $($versions -join ', ') - waiting for $env:VERSION..."
            } else {
                Write-Output "Waiting for Marketplace validation to publish trsdn.ppt-mcp..."
            }
            Start-Sleep -Seconds 30
        }
        Write-Output "::error::trsdn.ppt-mcp $env:VERSION is not listed 10 minutes after publishing."
        Write-Output "Check the validation status at https://marketplace.visualstudio.com/manage/publishers/trsdn"
        exit 1

    - name: Setup npm registry
      if: ${{ inputs.publish_npm }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    # setup-node's registry-url writes an _authToken line that resolves to an empty
    # string, which makes npm report a credentials error instead of falling back to
    # OIDC. Removing .npmrc outright keeps the tokenless path clean.
    - name: Configure npm authentication
      if: ${{ inputs.publish_npm }}
      shell: pwsh
      run: |
        $npmrc = Join-Path $env:USERPROFILE '.npmrc'
        if (Test-Path $npmrc) { Remove-Item $npmrc }
        # setup-node above may have put Node's bundled npm back in front of the copy
        # upgraded during preflight, so assert the OIDC-capable version at the point
        # of use rather than trusting step ordering.
        $raw = (npm --version | Select-Object -Last 1).Trim()
        if ($raw -match '^(\d+\.\d+\.\d+)' -and [version]$Matches[1] -ge [version]'11.5.1') {
            $npmVersion = $Matches[1]
        } else {
            # Same ^11.5.1 pin as the preflight: above the OIDC minimum, below npm 12,
            # which blocks dependency install scripts by default.
            npm install -g "npm@^11.5.1" 2>&1 | Out-Null
            $raw = (npm --version | Select-Object -Last 1).Trim()
            if ($raw -notmatch '^(\d+\.\d+\.\d+)' -or [version]$Matches[1] -lt [version]'11.5.1') {
                Write-Output "::error::npm $raw cannot use Trusted Publishing; 11.5.1 or newer is required."
                exit 1
            }
            $npmVersion = $Matches[1]
        }
        Write-Output "npm authentication: OIDC trusted publishing (npm $npmVersion)"
        npm config set registry https://registry.npmjs.org/

    # No continue-on-error on either publish: both steps reported success during the
    # v1.0.3 release while neither package reached npm.
    - name: Publish ppt-mcp-skill to npm
      if: ${{ inputs.publish_npm }}
      run: |
        cd npm-packages/ppt-mcp-skill
        npm publish --provenance --access public

    - name: Publish ppt-cli-skill to npm
      if: ${{ inputs.publish_npm }}
      run: |
        cd npm-packages/ppt-cli-skill
        npm publish --provenance --access public

    # npm's read path is eventually consistent: during the v1.1.0 release both packages
    # published successfully but the check still 404'd seconds later, which failed an
    # otherwise complete release (issue #120). The lag is largest for a package created
    # in the same run, as both skill packages were. So: poll instead of asking once.
    #
    # Five attempts with a fixed 15s pause (75s of patience, ~1 minute of waiting) is
    # deliberately linear rather than exponential - the propagation delay observed is a
    # short, roughly constant index lag, not a congested service that benefits from
    # backing off, and a fixed cadence keeps the log readable.
    #
    # Asked over the registry API rather than `npm view`, because npm resolves through
    # whatever registry the environment configured and a proxy feed's 404 would be
    # indistinguishable from a genuinely missing package. The exact version string is
    # compared against the keys of the `versions` object, never matched as a substring:
    # "1.1.0" is a substring of "11.1.0".
    - name: Verify npm packages are listed
      if: ${{ inputs.publish_npm }}
      shell: pwsh
      run: |
        $attempts = 5
        $delaySeconds = 15
        $pending = [System.Collections.ArrayList]@('ppt-mcp-skill', 'ppt-cli-skill')

        for ($attempt = 1; $attempt -le $attempts -and $pending.Count -gt 0; $attempt++) {
            foreach ($package in @($pending)) {
                $uri = "https://registry.npmjs.org/$package"
                $response = Invoke-WebRequest -Uri $uri -Method Get -UseBasicParsing `
                    -TimeoutSec 30 -SkipHttpErrorCheck -Headers @{ 'Cache-Control' = 'no-cache' }

                if ($response.StatusCode -ne 200) {
                    Write-Output "Attempt $attempt/$attempts - $package : GET $uri returned HTTP $($response.StatusCode)"
                    continue
                }

                $document = $response.Content | ConvertFrom-Json
                $published = @($document.versions.PSObject.Properties.Name)
                if ($published -contains $env:VERSION) {
                    $latest = $document.'dist-tags'.latest
                    Write-Output "Attempt $attempt/$attempts - $package : confirmed $env:VERSION (dist-tags.latest = $latest)"
                    $pending.Remove($package)
                } else {
                    $known = ($published | Select-Object -Last 5) -join ', '
                    Write-Output "Attempt $attempt/$attempts - $package : $env:VERSION not indexed yet (known versions: $known)"
                }
            }

            if ($pending.Count -gt 0 -and $attempt -lt $attempts) {
                Write-Output "Waiting ${delaySeconds}s for npm to index: $($pending -join ', ')"
                Start-Sleep -Seconds $delaySeconds
            }
        }

        if ($pending.Count -gt 0) {
            Write-Output "::error::Not on npm after $attempts attempts over $($attempts * $delaySeconds)s: $($pending -join ', ')"
            Write-Output "The publish steps above reported success, so check https://www.npmjs.com/package/$($pending[0])"
            Write-Output "before assuming the release failed - this check can lag a successful publish."
            exit 1
        }
        Write-Output "npm listings confirmed for version $env:VERSION"

  # =============================================================================
  # Job 9: Create Unified GitHub Release
  # =============================================================================
  create-release:
    name: Create GitHub Release
    needs: [version, create-tag, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v4

    - name: Set Version
      run: |
        echo "VERSION=${{ needs.version.outputs.version }}" >> $GITHUB_ENV

    - name: Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: List Artifacts
      run: |
        echo "Downloaded artifacts:"
        find artifacts -type f -name "*" | head -20

    - name: Extract Changelog from [Unreleased]
      id: changelog
      run: |
        CHANGELOG_FILE="CHANGELOG.md"

        if [ -f "$CHANGELOG_FILE" ]; then
          # Extract content between ## [Unreleased] and the next ## [ section
          CONTENT=$(awk '/^## \[Unreleased\]/,/^## \[/' "$CHANGELOG_FILE" | head -n -1 | tail -n +2)
          if [ -n "$CONTENT" ]; then
            echo "Found changelog under [Unreleased]"
            echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
            echo "$CONTENT" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "No content under [Unreleased]"
            echo "CHANGELOG=See repository for details." >> $GITHUB_OUTPUT
          fi
        else
          echo "CHANGELOG=See repository for details." >> $GITHUB_OUTPUT
        fi

    - name: Create Release
      run: |
        VERSION=${{ env.VERSION }}
        TAG=${{ needs.version.outputs.tag }}

        # Build release notes
        cat > release_notes.md << 'NOTES'
        ## PptMcp ${{ env.VERSION }}

        ### What's New
        ${{ steps.changelog.outputs.CHANGELOG }}

        ### Installation Options

        **VS Code Extension** (Recommended)
        - Download `PptMcp-${{ env.VERSION }}.vsix` below and run `code --install-extension PptMcp-${{ env.VERSION }}.vsix`
        - ${{ inputs.publish_vscode && 'Also available on the VS Code Marketplace' || 'Not on the VS Code Marketplace yet' }}
        - Self-contained: no .NET runtime or SDK required
        - Includes both MCP Server and CLI (`pptcli`)
        - Agent skills (ppt-mcp + ppt-cli) registered automatically via `chatSkills`

        **Claude Desktop (MCPB)**
        - Download `ppt-mcp-${{ env.VERSION }}.mcpb` and double-click to install

        **NuGet (.NET Tool)**
        ```powershell
        # MCP Server (for AI assistants)
        dotnet tool install --global PptMcp.McpServer
        # CLI (for coding agents and scripting)
        dotnet tool install --global PptMcp.CLI
        ```

        **npm / npx** (no .NET required)
        ```powershell
        npx -y mcp-server-ppt
        ```
        - Downloads the self-contained `PptMcp-MCP-Server-${{ env.VERSION }}-win-x64.zip` below on first run and caches it
        - Windows x64 only; `npm` refuses to install it elsewhere

        **Agent Skills** (for AI coding assistants)
        - VS Code Extension includes both skills automatically (ppt-mcp + ppt-cli)
        ${{ inputs.publish_npm && '- Install via npm: `npx skillpm install ppt-mcp-skill` or `npx skillpm install ppt-cli-skill`' || '' }}
        - Or download `ppt-skills-v${{ env.VERSION }}.zip` or install via `npx skills add trsdn/mcp-server-ppt`

        ### Requirements
        - Windows OS
        - Microsoft PowerPoint 2016+
        - .NET 10 Runtime or SDK (for NuGet installation only; VS Code and MCPB bundle it)

        ### Documentation
        - [Website](https://github.com/trsdn/mcp-server-ppt)
        - [GitHub Repository](https://github.com/trsdn/mcp-server-ppt)
        - [Changelog](https://github.com/trsdn/mcp-server-ppt/blob/main/CHANGELOG.md)
        NOTES

        # Collect all artifacts
        ARTIFACTS=""
        for f in artifacts/mcp-server-zip/*.zip; do [ -f "$f" ] && ARTIFACTS="$ARTIFACTS $f"; done
        for f in artifacts/mcp-server-selfcontained-zip/*.zip; do [ -f "$f" ] && ARTIFACTS="$ARTIFACTS $f"; done
        for f in artifacts/cli-nupkg/*.nupkg; do [ -f "$f" ] && ARTIFACTS="$ARTIFACTS $f"; done
        for f in artifacts/vscode-vsix/*.vsix; do [ -f "$f" ] && ARTIFACTS="$ARTIFACTS $f"; done
        for f in artifacts/mcpb-bundle/*.mcpb; do [ -f "$f" ] && ARTIFACTS="$ARTIFACTS $f"; done
        for f in artifacts/agent-skills/*.zip; do [ -f "$f" ] && ARTIFACTS="$ARTIFACTS $f"; done

        echo "Creating release with artifacts:$ARTIFACTS"

        gh release create "$TAG" $ARTIFACTS \
          --title "PptMcp $VERSION" \
          --notes-file release_notes.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Create a PR to update CHANGELOG.md since branch protection prevents direct push
    - name: Update Changelog (rename Unreleased to version)
      run: |
        VERSION=${{ env.VERSION }}
        DATE=$(date +%Y-%m-%d)
        BRANCH="chore/changelog-v${VERSION}"

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # Create branch from main
        git checkout -b "$BRANCH"

        # Replace [Unreleased] with [version] - date, add fresh [Unreleased]
        sed -i "s/^## \[Unreleased\]/## [$VERSION] - $DATE/" CHANGELOG.md
        sed -i "/^## \[$VERSION\] - $DATE/i ## [Unreleased]\n" CHANGELOG.md

        git add CHANGELOG.md
        git commit -m "chore: update CHANGELOG.md for v${VERSION} release [skip ci]"
        git push origin "$BRANCH"

        # Create PR
        gh pr create \
          --base main \
          --head "$BRANCH" \
          --title "chore: update CHANGELOG.md for v${VERSION} release" \
          --body "Automated post-release changelog update: renames \`[Unreleased]\` to \`[$VERSION] - $DATE\` and adds a fresh \`[Unreleased]\` section." \
          --label "documentation"
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
